name: Security gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily re-scan so newly published advisories fail the build even without a commit.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit (high/critical)
        run: node scripts/dependency-audit.mjs

      - name: SECURITY DEFINER allowlist
        run: node scripts/security-definer-scan.mjs
        env:
          SECURITY_GATE_STRICT: "1"

      - name: RLS policy & grant posture
        run: node scripts/rls-policy-scan.mjs --list
        env:
          SECURITY_GATE_STRICT: "1"

      - name: Hardcoded credential scan
        run: node scripts/secret-scan.mjs

      - name: Security unit tests (RBAC / role guards)
        run: bunx vitest run src/lib/__tests__/role-guards.test.ts src/lib/__tests__/rbac-matrix.test.ts
