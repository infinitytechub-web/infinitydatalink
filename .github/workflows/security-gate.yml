name: Security gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit (high/critical)
        run: node scripts/dependency-audit.mjs

      - name: SECURITY DEFINER allowlist
        run: node scripts/security-definer-scan.mjs
        env:
          SECURITY_GATE_STRICT: '1'
